
version: 2

models:
  - name: my_first_dbt_model
    description: "A starter dbt model"
    columns:
      - name: customer_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
  - name: customer_order
    description: "A starter dbt model"
    columns:
      - name: order_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
  - name: highest_pay
    description: "payment_ranking"
    columns:
      - name: payment_value
        description: "value of the payment by the customer_id"
        tests:
          - positive_values
    
  
