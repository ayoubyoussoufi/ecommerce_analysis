version: 2

models:

  - name: customers
    description: "Customer dimension table"
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        tests:
          - not_null
  - name: products
    description: "Product dimension table"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
  - name: order_items
    description: "Fact table at order item level"
    columns:

      - name: order_id
        tests:
          - not_null

      - name: order_item_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('products')
              field: product_id

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('customers')
              field: customer_id

      - name: price
        tests:
          - not_null

      - name: freight_value
        tests:
          - not_null