name: dbt CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/key.json

      - name: dbt deps
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/app \
            -w /usr/app \
            -e DBT_PROFILES_DIR=/usr/app \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/key.json \
            -v /tmp/key.json:/tmp/key.json \
            ghcr.io/dbt-labs/dbt-bigquery:1.9.0 \
            deps

      - name: dbt seed
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/app \
            -w /usr/app \
            -e DBT_PROFILES_DIR=/usr/app \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/key.json \
            -v /tmp/key.json:/tmp/key.json \
            ghcr.io/dbt-labs/dbt-bigquery:1.9.0 \
            seed --target dev

      - name: dbt build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/app \
            -w /usr/app \
            -e DBT_PROFILES_DIR=/usr/app \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/key.json \
            -v /tmp/key.json:/tmp/key.json \
            ghcr.io/dbt-labs/dbt-bigquery:1.9.0 \
            build --target dev --select staging intermediate --exclude seed
