name: dbt CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    container: ghcr.io/dbt-labs/dbt-postgres:1.7.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dbt deps

      - name: Run dbt build
        env:
          DBT_PROFILES_DIR: ./
        run: dbt build --target dev
