name: dbt CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          docker run --name test-postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=Blend2022* -e POSTGRES_DB=my_project_db -p 5432:5432 -d postgres:12
          sleep 10  # Wait for DB to be ready

      - name: Run dbt in container
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/usr/app \
            -w /usr/app \
            -e DBT_PROFILES_DIR=/usr/app \
            ghcr.io/dbt-labs/dbt-postgres:1.9.0 \
            bash -c "dbt deps && dbt build --target dev"
